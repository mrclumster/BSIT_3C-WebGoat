{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-lg bg-brand-50 flex items-center justify-center text-brand-600">
        <i data-lucide="log-in" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">Welcome back</h1>
        <p class="text-sm text-slate-500">Log in to continue</p>
      </div>
    </div>

    <form method="post" novalidate class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               value="{{ username }}" required minlength="3" maxlength="32"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               required minlength="8" maxlength="128"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
      </div>

      <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors">
        Log in
      </button>
    </form>

    <p class="text-sm text-slate-500 text-center mt-6">
      No account?
      <a href="{{ url_for('register') }}" class="text-brand-600 hover:text-brand-700 font-medium">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
