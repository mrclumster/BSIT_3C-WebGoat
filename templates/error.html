{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-8 reveal">
  <article class="article" style="border-left: 4px solid var(--danger); padding: 2rem;">
    <p class="kicker kicker-danger">Error</p>
    <h1 class="display text-3xl md:text-4xl leading-tight">Something went wrong.</h1>
    <hr class="rule-double mt-4">
    <p class="text-[1rem] mt-4" style="color: var(--ink-soft);">{{ message }}</p>
    <div class="mt-6 flex flex-wrap gap-3">
      <a href="{{ url_for('index') }}" class="btn-zine primary"><i data-lucide="home" class="w-4 h-4"></i> Back to home</a>
      <a href="{{ url_for('lessons_catalog') }}" class="btn-zine">Browse lessons</a>
    </div>
  </article>
</div>
{% endblock %}
