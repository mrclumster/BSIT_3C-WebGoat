{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center">
    <div class="w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center text-amber-600 mx-auto mb-4">
      <i data-lucide="alert-triangle" class="w-7 h-7"></i>
    </div>
    <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100 mb-2">Something went wrong</h1>
    <p class="text-slate-600 dark:text-slate-400 mb-6">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">
      <i data-lucide="home" class="w-4 h-4"></i> Go home
    </a>
  </div>
</div>
{% endblock %}
