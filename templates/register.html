{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-lg bg-brand-50 flex items-center justify-center text-brand-600">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Create an account</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">It only takes a minute</p>
      </div>
    </div>

    <form method="post" novalidate class="space-y-4" hx-boost="false">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               value="{{ username }}" required minlength="3" maxlength="32"
               pattern="[A-Za-z0-9_.\-]{3,32}"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">3&ndash;32 chars: letters, digits, <span class="mono">. _ -</span></p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="8" maxlength="128"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Minimum 8 characters. Hashed with bcrypt before storage.</p>
      </div>

      <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors">
        Create account
      </button>
    </form>

    <p class="text-sm text-slate-500 dark:text-slate-400 text-center mt-6">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-brand-600 hover:text-brand-700 font-medium">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
